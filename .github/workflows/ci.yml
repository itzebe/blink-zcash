name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript — lint, typecheck, build, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blink
          POSTGRES_PASSWORD: blink_dev_pw
          POSTGRES_DB: blink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://blink:blink_dev_pw@127.0.0.1:5432/blink_test
      TEST_DATABASE_URL: postgres://blink:blink_dev_pw@127.0.0.1:5432/blink_test
      ZCASH_NETWORK: testnet
      NEXT_PUBLIC_NETWORK: testnet
      APP_BASE_URL: http://localhost:3000
      BLINK_ZCASH_SERVICE_URL: ''
      BLINK_VERIFICATION_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build packages and apps
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate test database
        run: npm run db:migrate -w @blink/api
      - name: Unit and integration tests
        run: npm test

  rust:
    name: Rust — engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/blink-zcash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/blink-zcash
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Build
        run: cargo build --release
