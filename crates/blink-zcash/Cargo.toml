[package]
name = "blink-zcash"
version = "0.1.0"
edition = "2021"
description = "Authoritative Zcash address and ZIP 321 payment-request engine for BLINK, built on the official zcash Rust crates."
license = "MIT"
repository = "https://github.com/itzebe/blink-zcash"

[[bin]]
name = "blink-zcash"
path = "src/main.rs"

[lib]
name = "blink_zcash"
path = "src/lib.rs"

[dependencies]
# Official Zcash Rust crates. These provide the canonical implementation of
# ZIP 321 and Zcash address encoding. BLINK does not reimplement either.
#
# The `-pre.0` line is required to decode NU7 transactions: NU7 activates on
# Zcash testnet in October 2026 and its consensus branch id (0x77190AD9) is not
# present in any stable release yet. Pinning the pre-release keeps verification
# working against the live network instead of silently failing to decode.
zip321 = "0.10.0-pre.0"
zcash_primitives = "0.31.0-pre.0"
zcash_address = "0.14.0-pre.0"
zcash_protocol = "0.11.0-pre.0"
# Transparent address decoding (P2PKH/P2SH) used to match a transparent output
# against a requested recipient. Same pre-release line as the crates above.
zcash_transparent = "0.11.0-pre.0"
# Shielded note discovery. `sapling-crypto` and `orchard` provide the canonical
# note-decryption primitives; `zcash_note_encryption` provides the trial
# decryption driver. `zcash_keys` parses the recipient's Unified viewing key.
# These must resolve to the same versions the pinned `zcash_primitives` uses.
sapling-crypto = "0.9.0"
orchard = "0.16.0"
zcash_note_encryption = "0.5.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zcash_keys = "=0.17.0-pre.0"

[dev-dependencies]
# Test-only: build synthetic shielded transactions in-process to exercise the
# production trial-decryption path. `test-dependencies` enables the mock provers
# and test key constructors; these are never linked into the server binary.
sapling-crypto = { version = "0.9.0", features = ["test-dependencies"] }
orchard = { version = "0.16.0", features = ["test-dependencies"] }
zcash_primitives = { version = "0.31.0-pre.0", features = ["test-dependencies"] }
zcash_address = "0.14.0-pre.0"
zcash_protocol = "0.11.0-pre.0"
zcash_keys = { version = "=0.17.0-pre.0", features = ["test-dependencies"] }
rand = { version = "0.10", features = ["std_rng", "sys_rng"] }
subtle = "2"
nonempty = "0.11"
zcash_note_encryption = "0.5.1"
